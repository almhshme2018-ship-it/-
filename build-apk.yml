name: Build Huroofna APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q Huroofna_CloudBuild_1.0.0.zip -d project
          echo "Extracted project:"
          find project -maxdepth 3 -type f | head -50

      - name: Find Android project
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Find APK
        run: |
          echo "APK files:"
          find "${PROJECT_DIR}" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Huroofna-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
