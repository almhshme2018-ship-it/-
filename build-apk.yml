name: Build Huroofna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir -p project
          unzip -q Huroofna_CloudBuild_1.0.0.zip -d project
          echo "Project extracted successfully"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd project/HuroofnaCloud
          gradle --no-daemon assembleDebug --stacktrace

      - name: Find APK
        run: |
          find project/HuroofnaCloud -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Huroofna-debug-apk
          path: project/HuroofnaCloud/app/build/outputs/apk/debug/app-debug.apk
