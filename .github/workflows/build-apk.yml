name: Build Huroofna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir -p project
          unzip -q Huroofna_CloudBuild_1.0.0.zip -d project
          echo "Project extracted successfully"
          find project -maxdepth 4 -type f | head -100

            - name: Find Android project
          PROJECT_DIR="project/HuroofnaCloud"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          echo "Building Android project..."
          echo "PROJECT_DIR=$PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Huroofna-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
